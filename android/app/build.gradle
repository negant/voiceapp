apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// WaveSpeed reference MP3s: Metro packs require() into res/raw (assets_references_*),
// unreadable via BlobUtil. Ship the same files as APK assets/ for bundle-assets:// reads.
def waveSpeedReferenceAssetsDir = file("${projectDir}/../../assets/references")

// Play upload signing — copy android/keystore.properties.example → keystore.properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "pl.ukrywane.voiceapp"
    defaultConfig {
        applicationId "pl.ukrywane.voiceapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep in sync with package.json version (Play requires monotonic versionCode)
        versionCode 1
        versionName "1.0.0"
        // Overridden per buildType — release must not allow cleartext HTTP
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // Play uploads require the upload keystore (npm run android:keystore).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // Local smoke only — Play Console rejects debug-signed AABs.
                signingConfig signingConfigs.debug
                logger.warn(
                    "WARNING: release build signed with DEBUG keystore. " +
                    "Run npm run android:keystore before Play upload."
                )
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    sourceSets {
        getByName("main") {
            assets.srcDir(waveSpeedReferenceAssetsDir)
        }
    }

    // Keep WAV uncompressed when packaged as raw assets.
    androidResources {
        noCompress += ['wav']
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
