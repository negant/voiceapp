services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceapp-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voiceapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceapp}
      POSTGRES_DB: ${POSTGRES_DB:-voiceapp}
    volumes:
      - voiceapp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voiceapp_pg_data:
